<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil GitHub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #095aac;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 20px;
      font-weight: bold;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    #message { margin-top: 15px; font-weight: 500; min-height: 24px; color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Projet hébergé sur GitHub</div>
    <h1>Bienvenue sur mon site !</h1>
    <p>Site web conçu et déployé depuis un iPad avec Git & GitHub.</p>
    <button onclick="saluer()">Clique ici</button>
    <button onclick="alert('Action réussie !')">Nouveau bouton</button>
    <p><a href="https://github.com/maatti10" style="color: white;">Voir mon profil GitHub</a></p>
    <input type="text" placeholder="Écris quelque chose ici..." style="padding: 10px; border-radius: 8px; border: none; margin-top: 10px;">
    <div id="message"></div>
  </div>

  <script>
    function saluer() {
      document.getElementById('message').textContent = "🚀 Projet en ligne avec succès !";
    }
  </script>
</body>
</html>
